name: ETF Daily Monitor

on:
  schedule:
    # 14:00 UTC = 10:00 AM ET (EDT) — intraday snapshot ~30 min after open
    - cron: "0 14 * * 1-5"   # weekdays only
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest price data
        run: python download_history.py

      - name: Run daily monitor and send email
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python daily_monitor.py
